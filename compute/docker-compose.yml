services:
  jobmanager:
    image: flink:2.3.0
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - TZ=Asia/Shanghai
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    volumes:
      # 依赖 jar 放入仓库 jars/ 目录即可，见 jars/README.md
      - ../jars:/opt/flink/lib/jars
      # Paimon warehouse 持久化目录
      - ../tmp/paimon:/tmp/paimon
    networks:
      - data_default

  taskmanager:
    image: flink:2.3.0
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      - TZ=Asia/Shanghai
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 3
    volumes:
      - ../jars:/opt/flink/lib/jars
      - ../tmp/paimon:/tmp/paimon
    networks:
      - data_default

  sql-client:
    image: flink:2.3.0
    depends_on:
      - jobmanager
    command: bin/sql-client.sh
    environment:
      - TZ=Asia/Shanghai
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        rest.address: jobmanager
    volumes:
      - ../jars:/opt/flink/lib/jars
      - ../scripts:/opt/flink/scripts
      - ../tmp/paimon:/tmp/paimon
    networks:
      - data_default
    stdin_open: true
    tty: true

# 复用 data/docker-compose.yml 创建的外部网络，保证 Flink 能直连 db2 / elasticsearch
networks:
  data_default:
    external: true
