services:
  db2:
    image: ruanhang/db2-cdc-demo:v1
    privileged: true
    ports:
      - "50000:50000"
    environment:
      - LICENSE=accept
      - DB2INSTANCE=db2inst1
      - DB2INST1_PASSWORD=admin
      - DBNAME=testdb
      - ARCHIVE_LOGS=true
      - TZ=Asia/Shanghai       # 仅影响 Linux 层命令，DB2 时区由挂载的 /etc/localtime 决定
      - DB2CODEPAGE=1208       # 字符集 UTF-8
      - DB2_DBTIMEUTC=OFF      # 强制 DB2 使用本地时区
    volumes:
      - db2-data:/database
      # 初始化脚本（建表 + 种子数据），进入容器后手动执行：
      #   db2 connect to testdb && db2 -tf /init/init-db.sql
      - ./init:/init:ro
      # 时区自动初始化：挂载宿主机时区，容器启动即 Asia/Shanghai
      # （TZ 环境变量传不到 db2sysc，必须用 /etc/localtime）
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - default

  elasticsearch:
    image: elastic/elasticsearch:7.6.0
    environment:
      - cluster.name=docker-cluster
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - discovery.type=single-node
      - TZ=Asia/Shanghai
    ports:
      - "9200:9200"
      - "9300:9300"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - default

  kibana:
    image: elastic/kibana:7.6.0
    ports:
      - "5601:5601"
    networks:
      - default

volumes:
  db2-data:

networks:
  default:
    # 显式命名：compute/docker-compose.yml 以 external 方式引用该网络
    name: data_default
